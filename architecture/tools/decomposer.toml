# Sub-graph for the `decomposer` stage of workflow.toml.
#
# This is the Phase 0 hardness: turning Rust's logical decisions
# (boolean expressions with short-circuit, `if let`, `match`, match
# guards, `?`) into per-decision condition trees that the masking engine
# can reason over.
#
# Each `[[fn]]` block declares a function the implementation must provide.
# Each `[[call]]` block declares an intra-tool call edge.
# CI compares this against the syn-extracted call graph of the
# implementation crate — drift fails the build.

[meta]
tool = "decomposer"
crate = "floyd"

# ---------------------------------------------------------------------------
# Functions
# ---------------------------------------------------------------------------

[[fn]]
id = "decompose"
role = "entry"
visibility = "pub"
sig = "fn decompose(mir: &Mir) -> DecisionTree"
notes = "Entry point. Pinned by workflow.toml's `mir-extractor -> decomposer` edge payload."

[[fn]]
id = "handle_boolean"
sig = "fn handle_boolean(expr: &BoolExpr) -> Node"
handles = ["&&", "||", "!"]
notes = "Short-circuit evaluation makes this the source of most masking subtleties."

[[fn]]
id = "handle_if_let"
sig = "fn handle_if_let(expr: &IfLetExpr) -> Node"
handles = ["if let"]
notes = "MVP scope: patterns that bind a value (`if let Some(x) = opt`, `if let Ok(v) = r`). The presence of an `AssignDowncast` statement in an arm block is what distinguishes the matched arm from the unmatched arm; pattern shapes with no binding (`if let Some(_) = opt`) yield no decision."

[[fn]]
id = "handle_match"
sig = "fn handle_match(expr: &MatchExpr) -> Node"
handles = ["match"]
notes = "MVP scope: literal patterns on integer scrutinees. Each arm `v: bb_a` becomes one ITE with cond `<scrutinee> == <v>`; multi-arm matches nest right-leaning. Bool `match` continues to flow through `handle_boolean`. Enum-discriminant matches (`AssignDiscriminant` + `switchInt`) are declined — engineers wanting MC/DC on enum variants should use `if let` with a binding. Full pattern-matching MC/DC is a Phase 2 deliverable — it's an acknowledged open problem in the field."

[[fn]]
id = "handle_match_guard"
sig = "fn handle_match_guard(guard: &Guard) -> Node"
notes = "Out of MVP scope. Stubbed; kept reachable from `handle_match` so the architecture call graph stays valid for the Phase 2 implementation."

[[fn]]
id = "handle_try"
sig = "fn handle_try(expr: &TryExpr, f: &MirFunction) -> Option<Node>"
handles = ["?"]
notes = "Skip-through semantics: the `?` operator's MIR prefix (`Try::branch` → `discriminant` → `switchInt` over `ControlFlow`) is recognised, the Continue arm is selected by structural match (presence of an `AssignDowncast` with variant `Continue`), and decomposition resumes from the Continue arm. The early-return arm is propagation and carries no user-level decision. Chained `?`s recurse naturally through the same path."

# ---------------------------------------------------------------------------
# Intra-tool call edges
# ---------------------------------------------------------------------------

[[call]]
from = "decompose"
to = "handle_boolean"

[[call]]
from = "decompose"
to = "handle_if_let"

[[call]]
from = "decompose"
to = "handle_match"

[[call]]
from = "decompose"
to = "handle_try"

[[call]]
from = "handle_match"
to = "handle_match_guard"

[[call]]
from = "handle_boolean"
to = "handle_boolean"
notes = "Recursive: nested && / || / ! decomposition."
