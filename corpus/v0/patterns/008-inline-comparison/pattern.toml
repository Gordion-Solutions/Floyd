# Floyd corpus pattern.
# Schema documented at corpus/README.md.

schema_version = 1
id = "008-inline-comparison"
name = "Inline comparison with AND"
description = """
Canonical inline-comparison + `&&` shape — the dominant pattern in
real safety code. Rust lowers `speed > 50 && brake` to:

  bb0: {
    _3 = Gt(copy _1, const 50_i32);
    switchInt(move _3) -> [0: bb_false, otherwise: bb_then];
  }

where `_3` is a synthetic bool temporary with no source name. The
v0.1.0 engine declined this shape because the `switchInt` handler
required a debug name on the discriminant. The v0.2.0 engine
recognises the `Gt(...)` statement preceding the `switchInt` and
synthesizes the condition name `speed > 50` from its operands.

The recovered decision tree is identical in shape to a
two-condition AND over named bools (pattern 001-simple-and), with
the first condition's name replaced by the synthesized form.
"""

source = "src.rs"
function = "decide"
signature = "fn decide(speed: i32, brake: bool) -> bool"

[decision]
expr = "speed > 50 && brake"
conditions = ["speed > 50", "brake"]
short_circuit = true

variant = "masking"

# Truth table — 4 rows. `brake` is masked when `speed > 50` is false.
[[truth_table]]
inputs    = { "speed > 50" = false, brake = false }
result    = false
evaluated = ["speed > 50"]

[[truth_table]]
inputs    = { "speed > 50" = false, brake = true }
result    = false
evaluated = ["speed > 50"]

[[truth_table]]
inputs    = { "speed > 50" = true, brake = false }
result    = false
evaluated = ["speed > 50", "brake"]

[[truth_table]]
inputs    = { "speed > 50" = true, brake = true }
result    = true
evaluated = ["speed > 50", "brake"]

[[independence_pair]]
condition     = "speed > 50"
held_constant = ["brake"]
test_1 = { "speed > 50" = false, brake = true, result = false }
test_2 = { "speed > 50" = true,  brake = true, result = true }

[[independence_pair]]
condition     = "brake"
held_constant = ["speed > 50"]
test_1 = { "speed > 50" = true, brake = false, result = false }
test_2 = { "speed > 50" = true, brake = true,  result = true }

[[minimum_test_set]]
inputs = { "speed > 50" = false, brake = true }
result = false

[[minimum_test_set]]
inputs = { "speed > 50" = true, brake = false }
result = false

[[minimum_test_set]]
inputs = { "speed > 50" = true, brake = true }
result = true
